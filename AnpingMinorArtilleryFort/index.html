<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Model Rotation Debugger</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    /* 強制隱藏 VR 按鈕 */
    .a-enter-vr { display: none !important; }

    /* 除錯面板樣式 */
    #debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 15px;
      font-family: monospace;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label {
      width: 30px;
      font-weight: bold;
      font-size: 18px;
    }
    input[type=range] {
      flex-grow: 1;
      margin: 0 10px;
    }
    span.val {
      width: 40px;
      text-align: right;
    }
    #result-display {
      text-align: center;
      font-size: 18px;
      color: #00ff00; /* 綠色字體 */
      font-weight: bold;
      border: 1px solid #555;
      padding: 5px;
      margin-bottom: 5px;
      background: #222;
    }
    h3 {
      margin: 0 0 5px 0;
      font-size: 14px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="debug-panel">
    <h3>調整滑桿直到模型方向正確</h3>
    <div id="result-display">rotation="0 0 0"</div>

    <div class="slider-row">
      <label style="color:red">X</label>
      <input type="range" id="rot-x" min="-180" max="180" value="0" step="5">
      <span id="val-x" class="val">0</span>
    </div>

    <div class="slider-row">
      <label style="color:green">Y</label>
      <input type="range" id="rot-y" min="-180" max="180" value="0" step="5">
      <span id="val-y" class="val">0</span>
    </div>

    <div class="slider-row">
      <label style="color:cyan">Z</label>
      <input type="range" id="rot-z" min="-180" max="180" value="0" step="5">
      <span id="val-z" class="val">0</span>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="avatarModel" src="./model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-gltf-model 
        id="debug-model"
        src="#avatarModel" 
        rotation="0 0 0" 
        position="0 0 0" 
        scale="0.5 0.5 0.5" 
        animation-mixer>
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    // 取得元件
    const model = document.getElementById('debug-model');
    const sliderX = document.getElementById('rot-x');
    const sliderY = document.getElementById('rot-y');
    const sliderZ = document.getElementById('rot-z');
    
    const valX = document.getElementById('val-x');
    const valY = document.getElementById('val-y');
    const valZ = document.getElementById('val-z');
    
    const resultDisplay = document.getElementById('result-display');

    // 統一更新函式
    function updateRotation() {
      const x = sliderX.value;
      const y = sliderY.value;
      const z = sliderZ.value;

      // 更新數字顯示
      valX.textContent = x;
      valY.textContent = y;
      valZ.textContent = z;

      // 產生結果字串
      const rotationString = `${x} ${y} ${z}`;
      
      // 更新螢幕上的綠色文字，方便你抄寫
      resultDisplay.textContent = `rotation="${rotationString}"`;

      // 實際轉動模型
      model.setAttribute('rotation', rotationString);
    }

    // 監聽滑動事件
    sliderX.addEventListener('input', updateRotation);
    sliderY.addEventListener('input', updateRotation);
    sliderZ.addEventListener('input', updateRotation);
  </script>
</body>
</html>
