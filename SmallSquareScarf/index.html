<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* 開始按鈕的樣式 */
      #start-screen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
      #start-btn {
        padding: 15px 30px;
        font-size: 20px;
        background: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="start-screen">
      <button id="start-btn">點擊開始 AR 體驗</button>
    </div>

<a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; filterMinCF:0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      gesture-detector>
      

      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video src="#ar-video" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const video = document.getElementById('ar-video');
      const targetEntity = document.getElementById('target-entity');
      const scene = document.querySelector('a-scene');

      // 1. 點擊按鈕後，隱藏選單並初始化影片
      startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        video.play();
        video.pause(); // 先播再停，讓瀏覽器知道使用者同意播放
      });

      // 2. 當偵測到圖片時，播放影片
      targetEntity.addEventListener("targetFound", event => {
        console.log("target found");
        video.play();
      });

      // 3. 當圖片移出鏡頭時，暫停影片
      targetEntity.addEventListener("targetLost", event => {
        console.log("target lost");
        video.pause();
      });
    </script>
  </body>
</html>
